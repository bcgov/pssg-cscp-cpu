<div class="mb-3">
  @if (label) {
    <label [for]="id" class="form-label fw-normal">
      {{ label }}@if (isRequired) {
      <span style="color: #d93e45"> *</span>
    }
  </label>
}

@if (controlType === "select") {
  <select
    [formControl]="control"
    [id]="id"
    [name]="id"
    [class.is-invalid]="hasError"
    class="form-control"
    >
    @if (placeholder) {
      <option value="">
        {{ placeholder }}
      </option>
    }
    @for (option of options; track option) {
      <option [ngValue]="option.value">
        {{ option.label }}
      </option>
    }
  </select>
} @else {
  <input
    [formControl]="control"
    [type]="type"
    [id]="id"
    [name]="id"
    [placeholder]="placeholder"
    [mask]="mask"
    [class.is-invalid]="hasError"
    class="form-control"
    (blur)="onBlur()"
    />
  }

  <div [style.display]="hasError ? 'block' : 'none'">
    {{ errorMessage }}
  </div>
</div>
